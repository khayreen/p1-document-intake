name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: "21"
          cache: maven

      # The CDK tests run the stack through jsii, which needs Node.js.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build and test every module (no AWS account or API key needed)
        run: ./mvnw -B -ntp verify

      - name: Synthesise the CloudFormation template
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: ap-southeast-1
        run: npx -y aws-cdk@2.1148.1 synth --quiet
